[package]
name = "rustgram"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
grammers-client = "0.12"
grammers-mtsender = "0.12"
grammers-session = { version = "0.12", features = ["sqlite-storage"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
rpassword = "7"
