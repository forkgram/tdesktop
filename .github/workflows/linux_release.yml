name: Linux Release.

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: 'Only build the container image and warm the cache.'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a GitHub Release with the artifacts.'
        type: boolean
        default: false
      telegram:
        description: 'Publish update files to the Telegram channels (manual runs).'
        type: choice
        # 'off' must be quoted: YAML reads the bare word as boolean false, dropping it from the choices.
        options: ['off', scheduled, testing, released]
        default: 'off'
  push:
    tags:
      - 'v*'
  schedule:
    # Keep the library cache from the 7-day eviction; centos_env builds every library from source.
    - cron: '0 5 * * 1,4'

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  linux-release:
    name: Linux x64 Release
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      IMAGE_TAG: tdesktop:centos_env
      BUILD_CONFIG: MinSizeRel
      UPD_PREFIX: td-update-linux-x64-
      ASSET_PORTABLE: Forkgram.tar.xz
      ONLY_CACHE: ${{ (github.event_name == 'schedule' || inputs.only_cache) && 'true' || 'false' }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Read version.
        run: |
          awk 'NF { print $1"="$2 }' Telegram/build/version >> $GITHUB_ENV
          source <(awk 'NF { print $1"="$2 }' Telegram/build/version)

          if [ "$AlphaVersion" != "0" ]; then
            echo "AppVersionStrFull=${AppVersionStr}_${AlphaVersion}" >> $GITHUB_ENV
          elif [ "$BetaChannel" != "0" ]; then
            echo "AppVersionStrFull=${AppVersionStr}.beta" >> $GITHUB_ENV
          else
            echo "AppVersionStrFull=${AppVersionStr}" >> $GITHUB_ENV
          fi

          # Packer's channel and the file name suffix, both from BetaChannel.
          if [ "$BetaChannel" != "0" ]; then
            echo "UPD_CHANNEL=beta" >> $GITHUB_ENV
            echo "UPD_SUFFIX=-beta" >> $GITHUB_ENV
          else
            echo "UPD_CHANNEL=stable" >> $GITHUB_ENV
            echo "UPD_SUFFIX=" >> $GITHUB_ENV
          fi
          echo "Building version $AppVersionStr ($AppVersion)."

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Generate the Dockerfile.
        run: |
          set -e
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install

          # The checked-in Dockerfile is itself the Jinja template, so redirecting
          # into it truncates the input before the generator reads it.
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          printf '%s\n' "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

          if [ "$(grep -c '^FROM' Dockerfile)" -lt 1 ]; then
            echo "Generated Dockerfile has no FROM instruction:"
            head -20 Dockerfile
            exit 1
          fi
          echo "Generated Dockerfile: $(wc -l < Dockerfile) lines."

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      # Libraries build into BuildKit mount caches, which the layer cache above does not carry.
      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Set up DesktopPrivate.
        if: env.ONLY_CACHE == 'false'
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          set -e
          python3 - <<'PY'
          import os, pathlib

          private = pathlib.Path(os.environ['GITHUB_WORKSPACE']).parent / 'DesktopPrivate'
          private.mkdir(parents=True, exist_ok=True)

          # configure.py only regex-scans this one for the API credentials.
          (private / 'custom_api_id.h').write_text(
              'static const int32 ApiId = %s;\n'
              'static const char *ApiHash = "%s";\n'
              % (os.environ['API_ID'], os.environ['API_HASH']))

          (private / 'packer_private.h').write_text(
              'const char *PrivateKey = "";\n'
              'const char *PrivateBetaKey = "";\n')
          (private / 'alpha_private.h').write_text(
              '[[maybe_unused]] static const char *AlphaPrivateKey = "";\n')
          PY

          ls -l $GITHUB_WORKSPACE/../DesktopPrivate

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          set -e
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v $PWD/../DesktopPrivate:/usr/src/DesktopPrivate:ro \
            -e CONFIG=$BUILD_CONFIG \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} \
            -D DESKTOP_APP_SPECIAL_TARGET=linux

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          set -e
          release="out/$BUILD_CONFIG"
          for f in Forkgram Updater Packer; do
            if [ ! -f "$release/$f" ]; then
              echo "Build error: $release/$f does not exist."
              exit 1
            fi
          done
          file "$release/Forkgram"
          echo "Forkgram: $(stat -c %s "$release/Forkgram") bytes."

      # Before Packer, so the update carries the same stripped binary as the release asset.
      - name: Strip, keeping MiniDebugInfo.
        if: env.ONLY_CACHE == 'false'
        run: |
          set -e
          Telegram/build/minidebug.sh out/$BUILD_CONFIG/Forkgram
          echo "Stripped: $(stat -c %s out/$BUILD_CONFIG/Forkgram) bytes."

      - name: Pack the update file.
        if: env.ONLY_CACHE == 'false'
        run: |
          set -e
          cd out/$BUILD_CONFIG
          ./Packer -path Forkgram -path Updater -version "$AppVersion" \
            -channel "$UPD_CHANNEL" \
            -keys-loc "$GITHUB_WORKSPACE/Telegram/Resources/update" \
            -emit-signing-input update-signing-input.bin

          update="${UPD_PREFIX}${AppVersion}${UPD_SUFFIX}.unsigned"
          if [ ! -f "$update" ]; then
            echo "Packed update file $update was not produced."
            exit 1
          fi
          echo "Produced $update ($(stat -c %s "$update") bytes)."

      - name: Collect the artifacts.
        if: env.ONLY_CACHE == 'false'
        run: |
          set -e
          release="out/$BUILD_CONFIG"
          mkdir -p deploy

          tar -cJf "deploy/$ASSET_PORTABLE" -C "$release" Forkgram Updater

          # The update file keeps its raw name: the Telegram job derives the platform from it.
          cp "$release/${UPD_PREFIX}${AppVersion}${UPD_SUFFIX}.unsigned" deploy/

          ls -l deploy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        name: Upload the unsigned artifacts.
        if: env.ONLY_CACHE == 'false'
        with:
          name: unsigned-linux
          path: deploy/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  sign-release:
    name: Sign the Linux update
    needs: linux-release
    if: github.event_name != 'schedule' && !inputs.only_cache
    runs-on: ubuntu-latest
    environment: desktop-update-signing
    permissions:
      contents: write

    env:
      ASSET_PORTABLE: Forkgram.tar.xz

    steps:
      - name: Check out the release signing tools.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Telegram/build/sign_forkgram_update.py
            Telegram/build/version
            Telegram/Resources/update
          sparse-checkout-cone-mode: false

      - name: Download the unsigned release.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-linux
          path: deploy

      - name: Read artifact version.
        run: |
          awk '
            $1 == "AppVersionStr" { version = $2 }
            $1 == "AlphaVersion" { alpha = $2 }
            $1 == "BetaChannel" { beta = $2 }
            END {
              print "AppVersionStr=" version
              print "BetaChannel=" beta
              print "AppVersionStrFull=" version (alpha != "0" ? "_" alpha : (beta != "0" ? ".beta" : ""))
            }
          ' Telegram/build/version >> "$GITHUB_ENV"

      - name: Sign the update file.
        env:
          UPDATE_LOCAL_KEY: ${{ secrets.UPDATE_LOCAL_KEY }}
        run: >-
          python3 -I Telegram/build/sign_forkgram_update.py deploy Telegram/build/version
          Telegram/Resources/update linux-x64

      - name: Upload the artifacts.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Telegram Linux Release ${{ env.AppVersionStrFull }}
          path: deploy/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Publish the release.
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/')
        env:
          # A fork refuses release creation even with contents: write, so it needs a
          # RELEASE_TOKEN (repo scope) - which is why publish_release defaults to off.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -e
          R="$GITHUB_REPOSITORY"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TARGET=()
          else
            TAG="v$AppVersionStr"
            TARGET=(--target dev)
          fi

          # Create only if missing, else just add assets, so the Windows and macOS legs share one release.
          if [ "$BetaChannel" != "0" ]; then
            PRERELEASE=(--prerelease)
          else
            PRERELEASE=()
          fi
          if ! gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$R" "${TARGET[@]}" "${PRERELEASE[@]}" \
              --title "Forkgram $TAG" \
              --notes "Forkgram $TAG" >/dev/null 2>&1 \
              || gh release view "$TAG" -R "$R" >/dev/null
          fi

          gh release upload "$TAG" "deploy/$ASSET_PORTABLE" -R "$R" --clobber

  publish-telegram:
    name: Publish update files to Telegram
    needs: sign-release
    runs-on: ubuntu-latest
    if: >-
      needs.sign-release.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.telegram != 'off'))
    environment: telegram-publish
    # The feed message is rewritten read-modify-write; the shared group name
    # serialises this with the Windows workflow so neither loses its entry.
    concurrency:
      group: telegram-feed
      cancel-in-progress: false
    steps:
      - name: Clone the uploader script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/publish_telegram.py
            .github/scripts/requirements-telethon.txt
            .github/scripts/requirements-python-build.txt
            .github/data/logo_256_square.png
          sparse-checkout-cone-mode: false

      # Filtered: unfiltered this also pulls build-push-action's .dockerbuild
      # record, which fails to extract and takes the job down with it.
      - name: Download build artifacts.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Telegram Linux Release *
          path: artifacts

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Telethon.
        run: |
          python -m venv "$RUNNER_TEMP/telegram-venv"
          python="$RUNNER_TEMP/telegram-venv/bin/python"
          "$python" -m pip install --require-hashes -r .github/scripts/requirements-python-build.txt
          "$python" -m pip install --require-hashes --no-build-isolation -r .github/scripts/requirements-telethon.txt
          echo "$RUNNER_TEMP/telegram-venv/bin" >> "$GITHUB_PATH"

      - name: Publish.
        env:
          # api_id/api_hash aren't secret here (the session is) - Telegram's public open credentials.
          TG_API_ID: "611335"
          TG_API_HASH: "d524b414d21f4d37f08684c1df41ac9c"
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_FEED_CHANNEL: ${{ secrets.TG_FEED_CHANNEL }}
          TG_FILES_CHANNEL: ${{ secrets.TG_FILES_CHANNEL }}
          ARTIFACTS_DIR: artifacts
          # 'scheduled' sends for real but 360 days out - an invisible smoke test; delete those after.
          TG_SCHEDULE_DAYS: ${{ (github.event_name == 'workflow_dispatch' && inputs.telegram == 'scheduled') && '360' || '0' }}
          TG_ENTRY_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.telegram == 'testing') && 'testing' || 'released' }}
        run: python .github/scripts/publish_telegram.py
