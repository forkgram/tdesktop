name: Windows Release.

on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  publish-telegram:
    name: Publish update files to Telegram
    runs-on: ubuntu-latest
    environment: telegram-publish
    # The feed message is rewritten read-modify-write; the shared group name
    # serialises this with the Linux workflow so neither loses its entry.
    concurrency:
      group: telegram-feed
      cancel-in-progress: false
    steps:
      - name: Clone the uploader script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/publish_telegram.py
            .github/scripts/requirements-telethon.txt
            .github/scripts/requirements-python-build.txt
            .github/data/logo_256_square.png
          sparse-checkout-cone-mode: false

      - name: Download build artifacts.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Telegram * Release 7.4.6
          run-id: 45332174611
          github-token: ${{ github.token }}
          path: artifacts

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Telethon.
        run: |
          python -m venv "$RUNNER_TEMP/telegram-venv"
          python="$RUNNER_TEMP/telegram-venv/bin/python"
          "$python" -m pip install --require-hashes -r .github/scripts/requirements-python-build.txt
          "$python" -m pip install --require-hashes --no-build-isolation -r .github/scripts/requirements-telethon.txt
          echo "$RUNNER_TEMP/telegram-venv/bin" >> "$GITHUB_PATH"

      - name: Publish.
        env:
          # api_id/api_hash aren't secret here (the session is) - Telegram's public open credentials.
          TG_API_ID: "611335"
          TG_API_HASH: "d524b414d21f4d37f08684c1df41ac9c"
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_FEED_CHANNEL: ${{ secrets.TG_FEED_CHANNEL }}
          TG_FILES_CHANNEL: ${{ secrets.TG_FILES_CHANNEL }}
          ARTIFACTS_DIR: artifacts
          TG_ENTRY_KEY: released
        run: python .github/scripts/publish_telegram.py

  publish-channel:
    name: Upload the portable build to the channel
    runs-on: ubuntu-latest
    environment: telegram-publish
    concurrency:
      group: telegram-channel
      cancel-in-progress: false

    steps:
      - name: Clone the uploader script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/publish_channel.py
            .github/scripts/requirements-telethon.txt
            .github/scripts/requirements-python-build.txt
            .github/data/logo_256_square.png
          sparse-checkout-cone-mode: false

      - name: Download the asset.
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: Telegram.zip
          TAG_INPUT: v7.4.6
        run: |
          set -e
          TAG="${TAG_INPUT:-$TAG_BUILT}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi

          # The caption links the tag as an upstream version, so refuse anything
          # that is not a plain vX.Y.Z rather than posting a broken link.
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Not a version tag: $TAG" >&2
            exit 1
          fi

          # Betas carry a plain tag too, the way upstream tags its own, so the
          # tag cannot say which this is - the prerelease flag can.
          BETA=0
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
                    --json isPrerelease -q .isPrerelease)" = "true" ]; then
            BETA=1
          fi
          VERSION="${TAG#v}"

          mkdir -p deploy
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p "$ASSET_NAME" -D deploy
          ls -l "deploy/$ASSET_NAME"

          echo "ASSET_PATH=deploy/$ASSET_NAME" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET_BETA=$BETA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Telethon.
        run: |
          python -m venv "$RUNNER_TEMP/telegram-venv"
          python="$RUNNER_TEMP/telegram-venv/bin/python"
          "$python" -m pip install --require-hashes -r .github/scripts/requirements-python-build.txt
          "$python" -m pip install --require-hashes --no-build-isolation -r .github/scripts/requirements-telethon.txt
          echo "$RUNNER_TEMP/telegram-venv/bin" >> "$GITHUB_PATH"

      - name: Publish.
        env:
          TG_API_ID: "611335"
          TG_API_HASH: "d524b414d21f4d37f08684c1df41ac9c"
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_PUBLIC_CHANNEL: ${{ secrets.TG_PUBLIC_CHANNEL }}
          TG_SCHEDULE_DAYS: "0"
        run: python .github/scripts/publish_channel.py
